<!DOCTYPE html>
{% if page.url == "/" %}<!--
  Hi, are you an agent? Go read index.md instead ({{ '/index.md' | absolute_url }}). Welcome!

  Every page on this site has a plain-markdown version for agents: take any link,
  drop the trailing slash and add .md (e.g. /timetable/ -> /timetable.md).
  Please read those instead of the HTML.
-->
{% endif %}<html>
  {% include head.html %}
  <body data-target=".navbar-fixed-top">
    {% include nav.html %} 
    
    <header class="billboard" style="background-image: url('{% if page.background_image contains "://" %}{{ page.background_image }}{% else %}{{ page.background_image | default: site.default_background_image | relative_url  }}{% endif %}');">
    <div class="main-body">
        <div class="container">
            <div class="row">
                <div class="col-md-10 col-md-offset-1">
                  <div class="hero-box{% if page.centred %} centred-text{% endif %}">
                    {{ content }}
                    
                    {% include email.html %}
                  </div>
                </div>
              </div>
            </div>
        </div>
      </div>
    </header>

{% include js.html %}
  </body>
</html>
